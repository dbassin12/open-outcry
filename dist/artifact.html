<title>Open Outcry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: the trading pit. The price board of money runs across the top, the question sits in the middle,
   and the bottom tray always says what to do right now and holds the button to do it. */
:root {
  --bg: #ECF0EA;            /* ledger paper */
  --ledger: rgba(43, 86, 62, .075);
  --paper: #FAFBF7;         /* tickets and sheets */
  --ink: #111719;
  --muted: #55615B;
  --rule: #C6D0C7;
  --brass: #946000;         /* the bell */
  --gain: #0B7A3D;
  --loss: #B9213B;
  --gain-wash: rgba(11, 122, 61, .12);
  --loss-wash: rgba(185, 33, 59, .10);
  --demand: #1E5BD0;
  --supply: #C2410C;
  --focus: #1E5BD0;
  --shadow: 0 -14px 40px rgba(17, 30, 24, .18);
  --scrim: rgba(10, 14, 13, .62);

  /* the price board is a dark device in both themes */
  --board: #0B0F11;
  --board-2: #151C1F;
  --board-ink: #F1F4F0;
  --board-dim: #8E9994;
  --board-amber: #FFB43F;
  --board-gain: #4BE292;
  --board-loss: #FF7083;
  --flap-top: #1D2629;
  --flap-bot: #12191B;
  --flap-line: #050809;

  /* team jackets: fixed order, validated for color-vision differences */
  --t1: #2a78d6; --t2: #eb6834; --t3: #1baf7a; --t4: #eda100; --t5: #e87ba4; --t6: #4a3aa7;
  --t1-on: #0B0F11; --t2-on: #0B0F11; --t3-on: #0B0F11; --t4-on: #0B0F11; --t5-on: #0B0F11; --t6-on: #FFFFFF;

  --font-display: "Big Shoulders Display", "Big Shoulders", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1312; --ledger: rgba(190, 230, 205, .035); --paper: #161D1B; --ink: #E6ECE7; --muted: #9CA8A2; --rule: #2E3934;
    --brass: #E3A63E; --gain: #43D68B; --loss: #FF6E80; --gain-wash: rgba(67, 214, 139, .14); --loss-wash: rgba(255, 110, 128, .12);
    --demand: #7DAEFF; --supply: #FF9152; --focus: #7DAEFF; --shadow: 0 -14px 40px rgba(0, 0, 0, .55); --scrim: rgba(0, 0, 0, .66);
    --t1: #3987e5; --t2: #d95926; --t3: #199e70; --t4: #c98500; --t5: #d55181; --t6: #9085e9; --t6-on: #0B0F11;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1312; --ledger: rgba(190, 230, 205, .035); --paper: #161D1B; --ink: #E6ECE7; --muted: #9CA8A2; --rule: #2E3934;
  --brass: #E3A63E; --gain: #43D68B; --loss: #FF6E80; --gain-wash: rgba(67, 214, 139, .14); --loss-wash: rgba(255, 110, 128, .12);
  --demand: #7DAEFF; --supply: #FF9152; --focus: #7DAEFF; --shadow: 0 -14px 40px rgba(0, 0, 0, .55); --scrim: rgba(0, 0, 0, .66);
  --t1: #3987e5; --t2: #d95926; --t3: #199e70; --t4: #c98500; --t5: #d55181; --t6: #9085e9; --t6-on: #0B0F11;
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; font-size: clamp(14px, calc(min(1.05vw, 2vh) + 2px), 24px); }
body {
  height: 100%; margin: 0; color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.35;
  background-color: var(--bg);
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(1.9rem - 1px), var(--ledger) calc(1.9rem - 1px), var(--ledger) 1.9rem);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.ico { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
#stage { min-height: 0; overflow: auto; padding-block: clamp(.75rem, 2vh, 1.4rem); padding-inline: max(16px, 2vw); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 2.75rem; padding: .45rem 1rem;
  border: 2px solid var(--ink); border-radius: 3px; background: transparent; color: var(--ink); font-weight: 700; white-space: nowrap;
}
.btn:hover { background: var(--ink); color: var(--paper); }
.btn.primary {
  background: var(--ink); color: var(--paper); font-family: var(--font-display); font-weight: 800; font-size: 1.3rem;
  letter-spacing: .05em; text-transform: uppercase; padding-inline: 1.3rem;
}
.btn.primary:hover { background: var(--brass); border-color: var(--brass); color: var(--paper); }
.btn.big { width: 100%; min-height: 3.6rem; font-size: 1.65rem; white-space: normal; text-align: center; }
.btn.primary:disabled { opacity: .35; }
.btn.sm { min-height: 2.6rem; padding: .25rem .6rem; font-size: .95rem; }
.btn.sq { width: 2.75rem; padding: 0; font-size: 1.5rem; line-height: 1; }
.btn.ghost { border-color: var(--rule); }
.btn.danger { border-color: var(--loss); color: var(--loss); }
.btn.danger:hover, .btn.danger.armed { background: var(--loss); color: var(--paper); }
.btn.armed:not(.danger) { background: var(--loss); border-color: var(--loss); color: var(--paper); font-family: var(--font-body); font-size: 1rem; letter-spacing: 0; text-transform: none; white-space: normal; }
.hintbtn { min-height: 2.65rem; padding-block: .3rem; }
.iconbtn {
  display: inline-grid; place-items: center; width: 2.65rem; height: 2.65rem; padding: 0;
  border: 1.5px solid var(--rule); border-radius: 3px; background: transparent; color: var(--ink);
}
.iconbtn:hover { border-color: var(--ink); }
.iconbtn[aria-pressed="false"] .ico { opacity: .5; }

/* ---------- price board ---------- */
.board {
  position: relative; z-index: 5; display: flex; align-items: center; gap: clamp(.75rem, 1.6vw, 1.75rem);
  padding: .5rem max(16px, 1.6vw); background: var(--board); color: var(--board-ink); border-bottom: 3px solid var(--board-amber);
}
.brand { flex: none; display: grid; gap: .25rem; }
.brand-mark { font-family: var(--font-display); font-weight: 900; font-size: 1.6rem; line-height: .85; letter-spacing: .02em; text-transform: uppercase; }
.brand-mark span { color: var(--board-amber); }
.brand-sub { font-family: var(--font-mono); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--board-dim); }
.tiles { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .45rem; }
.tile {
  position: relative; flex: 1 1 9.8rem; min-width: 9.8rem; max-width: 15rem;
  display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "badge name" "badge cash";
  column-gap: .55rem; row-gap: .15rem; align-items: center; padding: .38rem .6rem .42rem .42rem;
  background: var(--board-2); border-radius: 3px;
}
button.tile { font: inherit; color: inherit; text-align: left; border: 0; margin: 0; cursor: default; }
button.tile:disabled { opacity: 1; cursor: default; }
/* Class: after an answer shows, tiles waiting for a tap get a dashed outline. A team marked right gets a solid green ring. */
.tile.can-mark { cursor: pointer; outline: 2px dashed var(--board-amber); outline-offset: -2px; }
.tile.can-mark:hover { background: #22302f; }
.tile.can-mark.on { outline: 3px solid var(--board-gain); outline-offset: -3px; }
.tile.solo { flex: 0 1 15rem; min-width: 12rem; grid-template-columns: minmax(0, 1fr); grid-template-areas: "name" "cash"; padding-left: .7rem; }
.tile.lead::before { content: ""; position: absolute; left: .42rem; right: .42rem; top: 0; height: 3px; background: var(--board-amber); border-radius: 0 0 2px 2px; }
.tile > .badge { grid-area: badge; }
.badge {
  display: inline-grid; place-items: center; min-width: 2.75rem; height: 2.75rem; padding: 0 .3rem; border-radius: 3px;
  background: var(--c); color: var(--on); font-family: var(--font-display); font-weight: 900; font-size: 1.15rem; letter-spacing: .04em;
}
.tname { grid-area: name; display: flex; align-items: baseline; justify-content: space-between; gap: .4rem; min-width: 0; font-weight: 700; font-size: .88rem; }
.tname .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .cash { grid-area: cash; }
.flap { display: inline-flex; gap: 2px; font-family: var(--font-mono); font-weight: 600; font-size: 1.22rem; color: var(--board-amber); perspective: 300px; font-variant-numeric: tabular-nums; }
.fc {
  position: relative; display: inline-block; width: .72em; text-align: center; line-height: 1.28; border-radius: 2px;
  background: linear-gradient(to bottom, var(--flap-top) 0 50%, var(--flap-bot) 50% 100%);
}
.fc::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--flap-line); }
.fc.flip { animation: flapflip .1s ease-in-out; }
@keyframes flapflip { 50% { transform: rotateX(80deg); } }
.delta { font-family: var(--font-mono); font-size: .8rem; font-weight: 600; white-space: nowrap; }
.delta.up { color: var(--board-gain); }
.delta.down { color: var(--board-loss); }
.delta.flat { color: var(--board-dim); }

/* ---------- bottom tray: one line that says what to do, and the button to do it ---------- */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem;
  padding: .55rem max(16px, 1.6vw) calc(.55rem + env(safe-area-inset-bottom, 0px));
  background: var(--paper); border-top: 3px solid var(--ink);
}
.do { flex: 1 1 18rem; min-width: 0; margin: 0; display: flex; align-items: center; gap: .6rem; font-size: 1.25rem; font-weight: 700; line-height: 1.25; }
.do::before { content: ""; flex: none; width: .65rem; height: .65rem; border-radius: 50%; background: var(--brass); animation: blink 1.6s steps(2) infinite; }
.do.win { color: var(--gain); }
.do.win::before { background: var(--gain); animation: none; }
.do.lose { color: var(--loss); }
.do.lose::before { background: var(--loss); animation: none; }
.bar .tools { display: flex; flex-wrap: wrap; gap: .3rem; min-width: 0; }
.bar .actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: .5rem; }
.bar .actions.wide { flex: 0 1 36rem; }
.bets { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: .5rem; width: 100%; }
.bet {
  display: grid; place-items: center; gap: .1rem; min-height: 3.4rem; padding: .3rem .7rem;
  background: var(--ink); color: var(--paper); border: 2px solid var(--ink); border-radius: 3px;
}
.bet b { font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; line-height: 1; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
.bet small { font-size: .85rem; font-weight: 700; opacity: .85; }
.bet:not(:disabled):hover { background: var(--brass); border-color: var(--brass); }
.allin { display: grid; gap: .5rem; padding: .6rem .75rem; background: var(--paper); border: 2px solid var(--brass); border-radius: 4px; animation: rise .3s ease both; }
.allin p { margin: 0; font-size: 1rem; line-height: 1.35; }
.allin-btns { display: flex; flex-wrap: wrap; gap: .5rem; }
.bet:disabled { opacity: .4; }
.bet.cancel { background: var(--paper); color: var(--ink); }
.bet.cancel:hover { background: var(--ink); color: var(--paper); }
.bet.all:hover { background: var(--ink); border-color: var(--ink); }
.bet.all.yes { background: var(--loss); border-color: var(--loss); color: var(--paper); }
.allin.armed { border-color: var(--loss); }
.allin-btns .btn { min-height: 3.4rem; }
.hint-used { display: inline-flex; align-items: center; gap: .35rem; padding: 0 .4rem; font-weight: 700; font-size: .95rem; color: var(--muted); }
.ss-verdict { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 2rem; line-height: 1; text-transform: uppercase; color: var(--muted); }
.ss-verdict.win { color: var(--gain); }
.ss-verdict.lose { color: var(--loss); }
.ss-btn.answer { background: var(--paper); color: var(--gain); border-color: var(--gain); }
.lastcard-btn { justify-self: start; }
.note-box { margin: 0; padding: .45rem .7rem; background: var(--paper); border-left: 5px solid var(--brass); font-size: 1.05rem; font-weight: 700; }
.note-box b { color: var(--brass); }
.btn.tool { min-height: 2.65rem; padding: .3rem .7rem; border-width: 1.5px; border-color: var(--rule); font-size: .95rem; }

/* ---------- home ---------- */
.home { max-width: 82rem; min-height: 100%; margin: 0 auto; display: grid; align-content: center; gap: clamp(1rem, 3vh, 2rem); }
.home-head { display: grid; gap: .55rem; }
.eyebrow { margin: 0; font-family: var(--font-mono); font-weight: 600; font-size: .85rem; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); }
.wordmark { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: clamp(3.2rem, 4.4vw + 1rem, 7.6rem); line-height: .8; letter-spacing: -.005em; text-transform: uppercase; }
.wordmark span { color: var(--brass); }
.lede { margin: 0; max-width: 52ch; font-size: 1.2rem; line-height: 1.42; }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(.75rem, 2vw, 1.5rem); }
.mode {
  position: relative; display: grid; align-content: start; gap: .5rem; min-height: 11.5rem; padding: 1.2rem 1.3rem 4.4rem 1.3rem;
  text-align: left; border: 3px solid var(--ink); border-radius: 5px; background: var(--paper); color: var(--ink);
  transition: transform .15s ease, border-color .15s ease;
}
.mode-solo { background: var(--board); color: var(--board-ink); border-color: var(--board); }
.mode-kicker { display: inline-flex; align-items: center; gap: .45rem; font-family: var(--font-mono); font-size: .85rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
.mode-solo .mode-kicker { color: var(--board-amber); }
.mode-title { font-family: var(--font-display); font-weight: 900; font-size: 2.7rem; line-height: .95; text-transform: uppercase; }
.mode-text { max-width: 34ch; font-size: 1.12rem; line-height: 1.35; }
.mode-solo .mode-text { color: var(--board-ink); }
.mode-go { position: absolute; right: 1.1rem; bottom: 1.1rem; display: inline-flex; align-items: center; gap: .4rem; padding: .5rem .95rem; border-radius: 3px; background: var(--ink); color: var(--paper); font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: .04em; text-transform: uppercase; }
.mode-solo .mode-go { background: var(--board-amber); color: var(--board); }
.mode:hover { transform: translateY(-2px); border-color: var(--brass); }
.resume { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding: .7rem .9rem; background: var(--paper); border: 2px solid var(--brass); border-radius: 3px; }
.resume p { margin: 0; flex: 1 1 16rem; font-size: 1.05rem; }
.resume-btns { display: flex; flex-wrap: wrap; gap: .5rem; }

/* ---------- rules (both setups) ---------- */
.rules { margin: 0; padding: 0; list-style: none; counter-reset: rule; display: grid; gap: .6rem; }
.rules li { counter-increment: rule; display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: .75rem; align-items: center; font-size: 1.2rem; font-weight: 700; line-height: 1.3; }
.rules li::before {
  content: counter(rule); display: grid; place-items: center; width: 2.2rem; height: 2.2rem; border-radius: 2px;
  background: var(--ink); color: var(--paper); font-family: var(--font-display); font-weight: 900; font-size: 1.3rem;
}

/* ---------- Solo setup ---------- */
.solo-setup { max-width: 80rem; min-height: 100%; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(1rem, 3.5vw, 3.5rem); align-items: center; }
.setup-col { display: grid; gap: .8rem; align-content: start; }
.pick-title { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; text-transform: uppercase; }
.lengths { display: grid; gap: .65rem; }
.length {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name go" "meta go"; align-items: center; gap: .15rem 1rem;
  padding: .8rem .9rem .8rem 1.1rem; text-align: left; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 4px;
}
.length b { grid-area: name; font-family: var(--font-display); font-weight: 900; font-size: 2rem; line-height: 1; text-transform: uppercase; }
.length .len-meta { grid-area: meta; font-size: 1.08rem; color: var(--muted); }
.length .len-go {
  grid-area: go; display: inline-flex; align-items: center; gap: .4rem; padding: .55rem 1rem; border-radius: 3px;
  background: var(--ink); color: var(--paper); font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: .04em; text-transform: uppercase;
}
.length:hover { border-color: var(--brass); }
.length:hover .len-go { background: var(--brass); }

/* ---------- Class setup ---------- */
.lobby { max-width: 96rem; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(1.25rem, 3vw, 3.5rem); align-items: start; }
.hero { display: grid; gap: 1rem; align-content: start; }
.signal { display: grid; gap: .5rem; align-content: start; max-width: 30rem; padding: .7rem .8rem; background: var(--paper); border: 2px solid var(--ink); border-radius: 3px; }
.signal h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; letter-spacing: .03em; text-transform: uppercase; }
.signal p { margin: 0; font-size: .95rem; color: var(--muted); }
.hands { display: flex; flex-wrap: wrap; gap: .55rem .9rem; }
.hand { display: grid; justify-items: center; gap: .15rem; font-family: var(--font-mono); font-size: .8rem; font-weight: 600; }
.hand svg { width: 2.2rem; height: 2.4rem; }
.hand-fill { fill: var(--paper); stroke: var(--ink); stroke-width: 1.8; }
.setup { display: grid; gap: 1.05rem; padding: 1.1rem 1.2rem 1.2rem; background: var(--paper); border: 2px solid var(--ink); border-radius: 4px; }
.setup h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; text-transform: uppercase; }
.setup fieldset { min-width: 0; margin: 0; padding: 0; border: 0; display: grid; gap: .5rem; }
.setup legend { padding: 0; margin-bottom: .45rem; font-family: var(--font-mono); font-size: .8rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stepper { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; }
.stepper output { min-width: 5.5rem; text-align: center; font-weight: 700; font-size: 1.15rem; }
.note { color: var(--muted); font-size: .9rem; }
.team-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 10.5rem), 1fr)); gap: .45rem .6rem; }
.team-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .45rem; align-items: center; }
.team-row .badge { height: 2.55rem; min-width: 2.7rem; font-size: 1rem; }
.team-row input {
  width: 100%; min-width: 0; padding: .5rem .6rem; font: inherit; font-weight: 700; color: var(--ink);
  background: var(--bg); border: 2px solid var(--rule); border-radius: 3px;
}
.team-row input:focus { border-color: var(--ink); }
.picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11.5rem), 1fr)); gap: .5rem; }
.picks.wrap { display: flex; flex-wrap: wrap; }
.pick { position: relative; display: block; cursor: pointer; }
.pick input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.pick > span { display: grid; gap: .1rem; height: 100%; padding: .55rem .75rem; background: var(--bg); border: 2px solid var(--rule); border-radius: 3px; }
.pick small { color: var(--muted); font-size: .88rem; }
.pick input:checked + span { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pick input:checked + span small { color: inherit; }
.pick input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.pick.small > span { display: block; padding: .42rem .7rem; font-weight: 700; font-size: .95rem; }
.pick input[type="checkbox"]:checked + span::before { content: "✓ "; }
.picks.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.more { border-top: 1.5px solid var(--rule); padding-top: .6rem; display: grid; gap: .9rem; }
.more summary { cursor: pointer; font-weight: 700; display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .6rem; }
.more[open] summary { margin-bottom: .2rem; }
.fine { margin: 0; font-size: .9rem; color: var(--muted); }
.fine.err { color: var(--loss); font-weight: 700; }

/* ---------- a question ---------- */
.round { height: 100%; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: clamp(1rem, 2.4vw, 2.75rem); }
.round.wide { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
@media (min-width: 901px) {
  /* wide screens: the shortage or surplus answer gets room for the full table and a big graph */
  .round.wide.desk-inventory:has(.callcard.revealed) { grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr); }
  .tt tr.set th, .tt tr.eqrow th { white-space: nowrap; }
}
.ticket, .callcard { min-height: 0; display: flex; flex-direction: column; gap: .62rem; }
.callcard { overflow-y: auto; padding: 0 .25rem .25rem 0; }
.desk-row { display: flex; flex-wrap: wrap; align-items: center; gap: .45rem .55rem; }
.desk-tag {
  display: inline-flex; align-items: center; gap: .4rem; padding: 0;
  font-family: var(--font-mono); font-weight: 700; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
.desk-tag.final, .desk-tag.practice, .desk-tag.review { color: var(--brass); }
.qnum { font-family: var(--font-mono); font-weight: 700; font-size: .88rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.worth { padding: .24rem .6rem; background: var(--board); color: var(--board-amber); border-radius: 2px; font-family: var(--font-mono); font-weight: 700; font-size: .95rem; }
.note-tag { display: block; flex-basis: 100%; font-weight: 700; font-size: 1rem; color: var(--ink); }
.market-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .75rem; font-family: var(--font-mono); }
.mkt { font-family: var(--font-body); font-weight: 700; font-size: 1.15rem; }
.px { color: var(--muted); }
.px-new { font-weight: 700; animation: rise .4s ease both .9s; }
.px-new.up, .px-new.down { color: var(--ink); }
.px-new.flat { color: var(--muted); }
.breaking { margin: 0; display: flex; align-items: center; gap: .5rem; font-family: var(--font-mono); font-weight: 700; font-size: .8rem; letter-spacing: .2em; text-transform: uppercase; color: var(--brass); }
.breaking::before { content: ""; width: .6rem; height: .6rem; border-radius: 50%; background: var(--brass); animation: blink 1.2s steps(2) infinite; }
.headline { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 2.45rem; line-height: .98; letter-spacing: .005em; text-transform: uppercase; text-wrap: balance; }
.headline.long { font-size: 2.05rem; }
.headlines { margin: 0; padding: 0; list-style: none; display: grid; gap: .5rem; }
.headlines li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .6rem; align-items: start; font-family: var(--font-display); font-weight: 800; font-size: 1.85rem; line-height: 1; text-transform: uppercase; text-wrap: balance; }
.headlines li::before { content: ""; width: .7rem; height: .7rem; margin-top: .4rem; background: var(--brass); }
.situation { margin: 0; max-width: 44ch; font-size: 1.42rem; font-weight: 700; line-height: 1.25; text-wrap: balance; }
.situation.long { font-size: 1.22rem; }
.graph { flex: 1 1 auto; min-height: 11rem; margin: 0; display: flex; align-items: center; justify-content: center; }
.graph svg { display: block; width: 100%; height: 100%; max-height: 64vh; }
.pair { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: fit-content(22rem) minmax(0, 1fr); gap: 1rem; align-items: stretch; }
.halo { paint-order: stroke; stroke: var(--paper); stroke-width: 6px; stroke-linejoin: round; }
.pair > .table-wrap { align-self: center; }
.pair .graph { min-height: 0; height: 100%; }
.pair .tt { width: 100%; }
.cases-lead { margin: 0; font-size: 1.05rem; font-weight: 700; }
.twocases { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; }
.case { margin: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: .2rem; padding: .3rem; border: 2px solid var(--rule); border-radius: 4px; }
.case figcaption { font-weight: 700; font-size: 1.05rem; text-align: center; }
.case svg { display: block; width: 100%; height: 100%; max-height: 52vh; }
.case-out { margin: 0; text-align: center; font-weight: 700; font-size: 1.05rem; }
.case-out b { color: var(--brass); text-transform: uppercase; }
.case .g-lab { font-size: 22px; }
.case .g-text { font-size: 19px; }

.call-head { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
.prompt { margin: 0; font-size: 1.25rem; font-weight: 700; color: var(--ink); }
.clock { flex: none; display: inline-flex; align-items: center; gap: .55rem; font-family: var(--font-mono); font-weight: 700; font-size: 1.9rem; font-variant-numeric: tabular-nums; }
.clock svg { width: 2.6rem; height: 2.6rem; transform: rotate(-90deg); }
.clock .track { fill: none; stroke: var(--rule); stroke-width: 5; }
.clock .prog { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset .2s linear; }
.clock.hot { color: var(--loss); }
.clock.hot .prog { stroke: var(--loss); }
.clock.paused .clock-num { opacity: .5; }
.clock.done .clock-num { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; color: var(--brass); }

.options { margin: 0; padding: 0; list-style: none; display: grid; gap: .5rem; }
.opt {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .8rem;
  padding: .5rem .75rem .5rem .5rem; background: var(--paper); border: 2px solid var(--rule); border-radius: 3px;
  transition: opacity .3s, border-color .3s, padding .3s;
}
.opt .num {
  display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border-radius: 2px;
  background: var(--ink); color: var(--paper); font-family: var(--font-display); font-weight: 900; font-size: 1.9rem; line-height: 1;
}
.opt .txt { min-width: 0; font-size: 1.38rem; font-weight: 700; line-height: 1.2; }
.options.long .opt .txt { font-size: 1.12rem; }
.pq { display: inline-flex; align-items: baseline; gap: .4rem; margin-right: 1.25rem; white-space: nowrap; }
.pq .k { font-family: var(--font-mono); font-size: .9rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.pq .v { font-size: 1.45rem; }
.opt .side { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: .3rem; }
.mb {
  display: inline-grid; place-items: center; min-width: 2.3rem; padding: .12rem .3rem; border-radius: 2px;
  background: var(--c); color: var(--on); font-family: var(--font-display); font-weight: 900; font-size: .95rem; letter-spacing: .04em;
}
.stamp { display: inline-flex; align-items: center; gap: .3rem; font-family: var(--font-mono); font-weight: 700; font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; color: var(--gain); white-space: nowrap; }
.stamp.miss { color: var(--loss); }
.callcard.revealed .opt.wrong { opacity: .5; padding-block: .28rem; }
.callcard.revealed .opt.wrong .num { width: 2.1rem; height: 2.1rem; font-size: 1.4rem; }
.callcard.revealed .opt.wrong .txt { font-size: 1rem; }
.callcard.revealed .opt.wrong .pq .v { font-size: 1.05rem; }
.callcard.revealed .opt.right { border-color: var(--gain); background: linear-gradient(var(--gain-wash), var(--gain-wash)), var(--paper); }
.opt.right .num { background: var(--gain); color: var(--paper); }
.options.graphs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.options.graphs .opt { grid-template-columns: auto minmax(0, 1fr); align-items: start; }
.options.graphs .opt .side { grid-column: 1 / -1; justify-content: flex-start; }
.options.graphs .txt { display: grid; gap: .25rem; font-size: 1rem; }
.options.graphs .txt svg { width: 100%; height: auto; max-height: 8.5rem; }
.callcard.revealed .options.graphs .opt.wrong .txt { font-size: .9rem; }
.callcard.revealed .options.graphs .opt.right .txt svg { max-height: 7rem; }
.callcard.revealed .options.graphs .opt.wrong .txt svg { max-height: 4.2rem; }
.callcard.revealed .options.graphs .opt.wrong .txt svg text { display: none; }

/* Solo answers are buttons */
.options.pickable > li { display: grid; }
.options.pickable .opt { width: 100%; text-align: left; color: var(--ink); cursor: pointer; }
.options.pickable .opt:hover:not(:disabled) { border-color: var(--muted); }
.options.pickable .opt.chosen { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.options.pickable .opt.chosen .num { background: var(--brass); color: var(--paper); }
.options.pickable .opt:disabled { cursor: default; opacity: 1; }
.callcard.revealed .options.pickable .opt.wrong { opacity: .5; }
.callcard.revealed .options.pickable .opt.wrong.chosen { opacity: 1; box-shadow: none; border-color: var(--loss); background: linear-gradient(var(--loss-wash), var(--loss-wash)), var(--paper); }
.callcard.revealed .options.pickable .opt.wrong.chosen .num { background: var(--loss); }
.callcard.revealed .options.pickable .opt.right { box-shadow: none; }
.callcard.revealed .options.pickable .opt.right .num { background: var(--gain); }

.why { display: grid; gap: .38rem; padding-top: .55rem; border-top: 3px solid var(--ink); animation: rise .45s ease both .3s; }
.why .verdict { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.55rem; line-height: 1; text-transform: uppercase; }
.why p { margin: 0; max-width: 64ch; font-size: 1.08rem; line-height: 1.38; }
.why .pattern { color: var(--muted); font-style: italic; }
.tag { display: inline; margin-right: .35rem; font-weight: 700; font-style: normal; }
.hint { margin: 0; display: flex; gap: .55rem; align-items: flex-start; padding: .55rem .75rem; background: var(--paper); border-left: 4px solid var(--brass); font-size: 1.08rem; animation: rise .3s ease both; }

/* Class: hands up, and the team buttons for who got it right */
.handsup { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .8rem; padding: .55rem .9rem; background: var(--board); color: var(--board-ink); border-radius: 3px; animation: pop .4s cubic-bezier(.2, 1.4, .4, 1); }
.handsup b { font-family: var(--font-display); font-weight: 900; font-size: 2.1rem; line-height: 1; text-transform: uppercase; color: var(--board-amber); }
.handsup span { font-size: 1.1rem; font-weight: 700; }
.coach { margin: 0; display: grid; gap: .1rem; padding: .55rem .8rem; background: var(--paper); border: 2px solid var(--brass); border-left-width: 6px; border-radius: 3px; font-size: 1.1rem; font-weight: 700; animation: rise .3s ease both; }
.coach b { font-family: var(--font-mono); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--brass); }
.bets.cue { outline: 3px dashed var(--brass); outline-offset: 3px; border-radius: 4px; }
@keyframes nudge { 50% { transform: translateY(5px); } }
/* graphs */
.g-axis { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: square; }
.g-tick { stroke: var(--ink); stroke-width: 1.5; }
.g-text { fill: var(--ink); font-family: var(--font-body); font-size: 17px; }
.g-small { fill: var(--muted); font-family: var(--font-mono); font-size: 14px; }
.g-q { fill: var(--ink); font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
.g-lab { fill: var(--ink); font-family: var(--font-body); font-weight: 700; font-size: 19px; }
.g-d { fill: none; stroke: var(--demand); stroke-width: 4; stroke-linecap: round; }
.g-s { fill: none; stroke: var(--supply); stroke-width: 4; stroke-linecap: round; }
.g-d-lab { fill: var(--demand); }
.g-s-lab { fill: var(--supply); }
.g-old { opacity: .42; stroke-dasharray: 9 7; }
.g-guide { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 5 5; }
.g-eq { fill: var(--ink); }
.g-eq2 { fill: var(--brass); stroke: var(--paper); stroke-width: 3; }
.g-arrow { fill: none; stroke: var(--ink); stroke-width: 2.6; }
.g-head { fill: var(--ink); stroke: none; }
.g-curve { fill: none; stroke: var(--ink); stroke-width: 3.5; }
.g-curve.base { stroke: var(--muted); stroke-width: 2.5; stroke-dasharray: 8 6; }
.g-curve.new { stroke: var(--brass); stroke-width: 3.5; }
.g-pt { fill: var(--ink); }
.g-pt-num { fill: var(--paper); font-family: var(--font-display); font-weight: 900; font-size: 18px; }
.g-pt.hit { fill: var(--gain); }
.g-dim { opacity: .3; }
.g-zone { fill: var(--gain-wash); stroke: var(--gain); stroke-width: 2; }
.g-gain { fill: var(--gain); }
.g-loss { fill: var(--loss); }
.g-brass { fill: var(--brass); }
.g-fillpaper { fill: var(--paper); }
.g-step { fill: var(--gain-wash); stroke: var(--gain); stroke-width: 2; }
.g-ring { fill: none; stroke: var(--gain); stroke-width: 3; }
.g-brass-t { fill: var(--brass); }
.g-loss-t { fill: var(--loss); }
.g-mv { transition: transform .95s cubic-bezier(.22, .8, .2, 1); }
svg.anim .late { opacity: 0; animation: fadein .4s ease forwards .95s; }

/* tables */
.table-wrap { max-width: 100%; overflow-x: auto; }
.tt { border-collapse: collapse; background: var(--paper); border: 2px solid var(--ink); font-variant-numeric: tabular-nums; }
.tt caption { caption-side: top; padding-bottom: .35rem; text-align: left; font-size: .95rem; font-weight: 700; color: var(--ink); }
.tt th, .tt td { padding: .42rem .85rem; border-bottom: 1.5px solid var(--rule); text-align: right; font-size: 1.3rem; }
.tt thead th { font-family: var(--font-mono); font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border-bottom: 2px solid var(--ink); vertical-align: bottom; }
.tt th[scope="row"], .tt thead th:first-child { text-align: left; }
.tt tbody th { font-weight: 700; }
.tt td { font-family: var(--font-mono); font-weight: 600; }
.tt.compact th, .tt.compact td { font-size: 1.05rem; padding: .35rem .6rem; }
.tt.compact thead th { font-size: .8rem; }
.tt .oc { border-left: 2px solid var(--ink); }
.tt .low { background: var(--gain-wash); color: var(--gain); }
.tt tr.mark > * { background: linear-gradient(var(--gain-wash), var(--gain-wash)); }
.tt tr.set > * { box-shadow: inset 0 2px 0 var(--brass), inset 0 -2px 0 var(--brass); }
.tt tr.eqrow th::after { content: " ← equilibrium"; font-family: var(--font-mono); font-size: .8rem; font-weight: 600; color: var(--muted); }
.tt tr.set th::after { content: " ← set price"; font-family: var(--font-mono); font-size: .8rem; font-weight: 600; color: var(--brass); }
.tt.short tr.set th::after, .tt.short tr.eqrow th::after { content: none; }
.oc-note { margin: 0; font-size: .95rem; color: var(--muted); }
.oc-note b { color: var(--gain); }

.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; }
.choice { display: grid; gap: .25rem; align-content: start; padding: .8rem .9rem; background: var(--paper); border: 2px solid var(--rule); border-radius: 3px; }
.choice b { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; text-transform: uppercase; line-height: 1; }
.choice span { font-family: var(--font-mono); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.choice.picked { border-color: var(--ink); }
.choice.next { border-color: var(--gain); background: linear-gradient(var(--gain-wash), var(--gain-wash)), var(--paper); }
.choice.next span { color: var(--gain); font-weight: 700; }
.choice.none { opacity: .55; }
.chip {
  display: inline-grid; place-items: center; min-width: 2.6rem; min-height: 2.6rem; padding: .15rem .4rem; line-height: 1.05;
  background: var(--paper); color: var(--ink); border: 2px solid var(--rule); border-radius: 3px; font-weight: 700;
}
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--brass); box-shadow: inset 0 0 0 2px var(--brass); }
.chip[aria-pressed="true"]::before { content: "✓ Showing: "; color: var(--brass); }
.chip.wide { padding-inline: .8rem; font-size: .95rem; }

/* ---------- speed round ---------- */
.flash { height: 100%; max-width: 84rem; margin: 0 auto; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: .8rem; }
.flash-top { display: grid; gap: .35rem; }
.flash-title { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 3rem; line-height: .9; text-transform: uppercase; }
.flash-title span { color: var(--brass); }
.flash-rule { margin: 0; max-width: 80ch; font-size: 1.1rem; }
.speed-key { margin: 0; max-width: 84ch; font-size: 1.05rem; color: var(--muted); }
.speed-key b { color: var(--ink); font-family: var(--font-display); font-size: 1.15rem; letter-spacing: .04em; text-transform: uppercase; }
.flash-card { min-height: 0; overflow: auto; display: grid; align-content: center; gap: .65rem; padding: 1.1rem 1.4rem; background: var(--paper); border: 3px solid var(--ink); border-radius: 4px; }
.flash-count { margin: 0; font-family: var(--font-mono); font-size: .95rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.flash-count b { display: inline-block; margin-left: .3rem; padding: .05rem .55rem; background: var(--brass); color: var(--paper); border-radius: 3px; font-family: var(--font-display); font-size: 1.9rem; letter-spacing: .03em; vertical-align: middle; }
.flash-statement { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 3.2rem; line-height: 1; text-transform: uppercase; text-wrap: balance; }
.flash-choices { display: flex; flex-wrap: wrap; gap: 1rem; }
.flash-choices span { padding: .15rem 1rem; border: 3px dashed var(--rule); color: var(--muted); font-family: var(--font-display); font-weight: 900; font-size: 2rem; text-transform: uppercase; }
.flash-answer { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: .5rem 1.2rem; animation: rise .35s ease both; }
.flash-answer .big { display: grid; font-family: var(--font-display); font-weight: 900; font-size: 3.2rem; line-height: .95; text-transform: uppercase; color: var(--gain); }
.flash-answer .big small { font-family: var(--font-mono); font-size: .8rem; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
.flash-answer svg { width: 9.5rem; height: 6.6rem; }
.flash-answer p { margin: 0; font-size: 1.22rem; }

/* Solo speed round */
.speed, .speed-intro { max-width: 70rem; margin: 0 auto; display: grid; gap: .8rem; align-content: start; }
.speed-intro { min-height: 100%; align-content: center; }
.ss-card { display: grid; gap: .8rem; padding: 1.1rem 1.3rem 1.2rem; background: var(--paper); border: 3px solid var(--ink); border-radius: 4px; }
.ss-card .flash-statement { font-family: var(--font-body); font-weight: 700; font-size: 2.1rem; line-height: 1.2; text-transform: none; }
.ss-btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
.ss-btn {
  display: grid; place-items: center; gap: .2rem; min-height: 5.2rem; padding: .5rem;
  background: var(--ink); color: var(--paper); border: 3px solid var(--ink); border-radius: 4px;
  font-family: var(--font-display); font-weight: 900; font-size: 2.6rem; line-height: 1; letter-spacing: .03em; text-transform: uppercase;
}
.ss-btn:hover:not(:disabled) { background: var(--brass); border-color: var(--brass); }
.ss-btn small { display: inline-flex; align-items: center; gap: .3rem; font-family: var(--font-body); font-size: 1rem; font-weight: 700; letter-spacing: 0; text-transform: none; }
.ss-btn:disabled { cursor: default; opacity: 1; }
.ss-btn.chosen:not(:disabled) { background: var(--brass); border-color: var(--brass); }
.ss-btn.right { background: var(--gain); border-color: var(--gain); color: var(--paper); }
.ss-btn.wrong { background: var(--paper); color: var(--muted); border-color: var(--rule); }
.ss-btn.wrong.chosen { color: var(--loss); border-color: var(--loss); background: linear-gradient(var(--loss-wash), var(--loss-wash)), var(--paper); }
.tbar-wrap { display: flex; align-items: center; gap: .6rem; }
.tbar { position: relative; flex: 1; height: 1.1rem; overflow: hidden; background: var(--rule); border-radius: 3px; }
.tbar i { position: absolute; inset: 0; background: var(--ink); transform-origin: left center; transition: transform .1s linear; }
.tbar.hot i { background: var(--loss); }
.tnum { flex: none; min-width: 4.2rem; text-align: right; font-family: var(--font-mono); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.ss-rules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; }
.ss-rule { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "name name" "pic text"; gap: .4rem 1rem; align-items: center; padding: .4rem 0 .4rem 1rem; border-left: 6px solid var(--brass); }
.ss-rule b { grid-area: name; font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1; text-transform: uppercase; color: var(--brass); }
.ss-rule svg { grid-area: pic; width: 8.5rem; height: auto; }
.ss-rule p { grid-area: text; margin: 0; font-size: 1.12rem; }
.ss-money { margin: 0; font-weight: 700; font-size: 1.2rem; }

/* ---------- halfway, results ---------- */
.update, .results { max-width: 92rem; margin: 0 auto; display: grid; gap: .85rem; align-content: start; }
.screen-title { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 3.6rem; line-height: .9; text-transform: uppercase; }
.screen-sub { margin: 0; max-width: 64ch; font-size: 1.2rem; }
.split { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 1.5rem; align-items: start; }
.ranks { margin: 0; padding: 0; list-style: none; display: grid; gap: .4rem; }

/* ---------- motion ---------- */
@keyframes fadein { to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes pop { from { opacity: 0; transform: scale(.8); } }

}

/* ---------- narrow screens ---------- */
@media (max-width: 900px) {

  .ss-btn { min-height: 4.4rem; font-size: 2.1rem; }
  .ss-card .flash-statement { font-size: 1.5rem; }
  .screen-title { font-size: 2.5rem; }
  .winner h2 { font-size: 2.4rem; }
  .team-rows { grid-template-columns: minmax(0, 1fr); }

    const ends = teams.map((t) => ({ t, x: X(t.history.length - 1), y: Y(t.history[t.history.length - 1]) })).sort((a, b) => a.y - b.y);
    let prev = -1e9;
    ends.forEach((e) => { e.ly = Math.max(e.y, prev + 17); prev = e.ly; });
    const over = ends.length ? ends[ends.length - 1].ly - (Bm + 4) : 0;
    if (over > 0) ends.forEach((e) => { e.ly -= over; });
    ends.forEach((e) => {
      g += `<line class="lc-lead" x1="${(e.x + 7).toFixed(1)}" y1="${e.y.toFixed(1)}" x2="${R + 10}" y2="${e.ly.toFixed(1)}"/>`;
      g += `<circle class="lc-end" cx="${e.x.toFixed(1)}" cy="${e.y.toFixed(1)}" r="5.5" style="fill: var(--t${e.t.color + 1})"/>`;
      g += `<text class="lc-lab" x="${R + 14}" y="${(e.ly + 4.5).toFixed(1)}">${esc(e.t.name)} ${shortMoney(e.t.cash)}</text>`;
    });
    charts[id] = { teams: teams.map((t) => ({ name: t.name, color: t.color, history: t.history.slice() })), L, R, n, W };
    const legend = teams.map((t) => `<li><i style="--c: var(--t${t.color + 1})"></i>${esc(t.name)}</li>`).join('');
    return `<figure class="lc" data-chart="${id}"><figcaption>${esc(title)}</figcaption><ul class="lc-legend">${legend}</ul><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of each team's money after every round">${g}<line class="lc-cross" x1="0" x2="0" y1="${T}" y2="${Bm}" visibility="hidden"/><rect class="lc-hit" x="${L}" y="${T}" width="${R - L}" height="${Bm - T}" fill="transparent"/></svg><div class="lc-tip" hidden></div></figure>`;
  }
  function wireCharts() {
    $$('#stage .lc[data-chart]').forEach((fig) => {
      const c = charts[fig.dataset.chart];
      if (!c || fig.dataset.wired) return;
      fig.dataset.wired = '1';
      const svg = $('svg', fig), cross = $('.lc-cross', fig), tip = $('.lc-tip', fig);
      const move = (ev) => {
        const rect = svg.getBoundingClientRect(), x = (ev.clientX - rect.left) * (c.W / rect.width);
        const i = Math.max(0, Math.min(c.n - 1, Math.round(((x - c.L) / (c.R - c.L)) * (c.n - 1))));
        const cx = c.L + (i / (c.n - 1)) * (c.R - c.L);
        cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
        const rows = c.teams.map((t) => ({ t, v: t.history[Math.min(i, t.history.length - 1)] })).sort((a, b) => b.v - a.v);
        tip.innerHTML = `<b>${i === 0 ? 'Start' : 'After round ' + i}</b><br>` + rows.map((rw) => `<i style="--c: var(--t${rw.t.color + 1})"></i>${esc(rw.t.name)} ${money(rw.v)}`).join('<br>');
        tip.hidden = false;
        const fr = fig.getBoundingClientRect();
        let left = ev.clientX - fr.left + 14;
        if (left + tip.offsetWidth > fr.width - 8) left = ev.clientX - fr.left - tip.offsetWidth - 14;
        tip.style.left = Math.max(8, left) + 'px';
        tip.style.top = Math.max(8, ev.clientY - fr.top - tip.offsetHeight / 2) + 'px';
      };
      svg.addEventListener('pointermove', move);
      svg.addEventListener('pointerdown', move);
      svg.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); tip.hidden = true; });
    });
  }

  /* ================= price board ================= */
  function setFlap(el, text, animate) {
    if (!el) return;
    (el._iv || []).forEach(clearInterval);
    el._iv = [];
    const old = el.dataset.v || '';
    el.dataset.v = text;
    const target = Array.from(text), prev = Array.from(old.padStart(target.length, ' ').slice(-target.length));
    if (!animate || reduceMotion() || old === text) { el.innerHTML = target.map((ch) => `<span class="fc">${esc(ch)}</span>`).join(''); return; }
    el.innerHTML = prev.map((ch) => `<span class="fc">${esc(ch)}</span>`).join('');
    const cells = $$('.fc', el);
    cells.forEach((cell, i) => {
      if (prev[i] === target[i]) return;
      let n = 0;
      const steps = 4 + i;
      const iv = setInterval(() => {
        n++;
        cell.classList.remove('flip'); void cell.offsetWidth; cell.classList.add('flip');
        if (n >= steps) { clearInterval(iv); cell.textContent = target[i]; }
        else cell.textContent = /\d/.test(target[i]) ? String(Math.floor(Math.random() * 10)) : target[i];
      }, 60);
      el._iv.push(iv);
    });
  }
  function renderBoard() {
    const tiles = $('#tiles');
    if (state.mode === 'solo' && state.solo && state.screen !== 'soloSetup') {
      tiles.innerHTML = `<div class="tile solo" id="tile-0"><span class="tname"><span class="nm">Your money</span><span class="delta" id="delta-0"></span></span><span class="cash flap" id="cash-0" role="img" aria-label="Your money: ${money(state.solo.cash)}"></span></div>`;
      setFlap($('#cash-0'), money(state.solo.cash), false);
      updateBoard(false);
      return;
    }
    if (state.mode !== 'class' || state.screen === 'home') { tiles.innerHTML = ''; return; }
    const setup = state.screen === 'classSetup', teams = setup ? buildTeams(state.settings) : state.teams;
    /* In a game the tiles are buttons: after the answer shows, the teacher taps each team that got it right. */
    const tag = setup ? 'div' : 'button';
    tiles.innerHTML = teams.map((t, i) => `<${tag}${setup ? '' : ' type="button" data-act="tile" disabled'} class="tile" id="tile-${i}" data-i="${i}" style="${teamStyle(t.color)}">
        <span class="badge" aria-hidden="true">${esc(t.badge)}</span>
        <span class="tname"><span class="nm">${esc(t.name)}</span><span class="delta" id="delta-${i}"></span></span>
        <span class="cash flap" id="cash-${i}" role="img" aria-label="${esc(t.name)}: ${money(t.cash)}"></span>
      </${tag}>`).join('');
    teams.forEach((t, i) => setFlap($('#cash-' + i), money(t.cash), false));
    updateBoard(false);
  }
  /* Class: can the teacher tap team tiles right now? 'round' after an answer shows, 'speed' after a speed-round answer shows. */
  function canMark() {
    if (state.mode !== 'class') return '';
    if (state.screen === 'round' && state.phase === 'revealed') return 'round';
    if (state.screen === 'speed' && state.speed && state.speed.phase === 'shown') return 'speed';
    return '';
  }
  const soloResultShowing = () => (state.screen === 'round' && state.phase === 'revealed') || (state.screen === 'speed' && !!state.speed && state.speed.phase === 'shown');
  function updateBoard(animate) {
    if (state.mode === 'solo') {
      const so = state.solo, cash = $('#cash-0'), de = $('#delta-0');
      if (!so || !cash) return;
      setFlap(cash, money(so.cash), animate);
      cash.setAttribute('aria-label', 'Your money: ' + money(so.cash));
      const L = soloResultShowing() && !so.practice ? so.last : null;
      if (!L) { de.textContent = ''; de.className = 'delta'; }
      else if (L.picked === 'none') { de.textContent = 'Out of time'; de.className = 'delta flat'; }
      else if (!L.delta) { de.textContent = 'No change'; de.className = 'delta flat'; }
      else { de.textContent = signed(L.delta); de.className = 'delta ' + (L.delta > 0 ? 'up' : 'down'); }
      return;
    }
    if (state.mode !== 'class' || state.screen === 'classSetup' || !state.teams.length) return;
    const teams = state.teams, can = canMark();
    const max = Math.max.apply(null, teams.map((t) => t.cash)), allSame = teams.every((t) => t.cash === max);
    teams.forEach((t, i) => {
      const tile = $('#tile-' + i);
      if (!tile) return;
      const cash = $('#cash-' + i), de = $('#delta-' + i);
      setFlap(cash, money(t.cash), animate);
      cash.setAttribute('aria-label', `${t.name}: ${money(t.cash)}`);
      tile.classList.toggle('lead', !allSame && t.cash === max);
      if (tile.tagName === 'BUTTON') {
        const on = can === 'round' ? !!state.marks[i] : can === 'speed' ? state.speed.winner === i : false;
        tile.disabled = !can;
        tile.classList.toggle('can-mark', !!can);

      const d = state.deltas && state.deltas[i];
      if (!d || !d.delta) { de.textContent = ''; de.className = 'delta'; return; }
      de.textContent = signed(d.delta); de.className = 'delta ' + (d.delta > 0 ? 'up' : 'down');
    });
  }

  /* --- a question (Class, Solo, practice, and Review my misses all use this) --- */
  function marketLine(r, after) {

  const dirWord = (d) => (d > 0 ? '▲ Up' : d < 0 ? '▼ Down' : '? Can’t tell');

    return `<ol class="options${cls}">` + optionItems(r).map((txt, k) => {

      const inner = `<span class="num" aria-hidden="true">${n}</span><span class="txt">${txt}</span><span class="side">${side}</span>`;

  function promptFor(r) {

    if (r.desk === 'news') return `What happens to the price and quantity of ${m}?`;

  function clockHTML(r, seg) {

  function shiftWords(s) { return (s.c === 'D' ? 'Demand ' : 'Supply ') + (s.d > 0 ? 'increases (shifts right)' : 'decreases (shifts left)'); }
  function whyHTML(r) {
    let verdict, extra = '';
    if (r.desk === 'news') {
      verdict = shiftWords(r.shift);
      extra = `<p><span class="tag">Shifter:</span>${esc(r.shifter)}</p><p class="pattern">${r.shift.c === 'D' ? 'Price and quantity moved the same way. That pattern means demand shifted.' : 'Price and quantity moved in opposite directions. That pattern means supply shifted.'}</p>`;

  /* Double shift, after the answer: both possible cases side by side, so the picture itself shows why one of price or quantity can't be told. */
  function twoCasesHTML(r) {
    const d = r.shifts.find((x) => x.c === 'D').d, sd = r.shifts.find((x) => x.c === 'S').d;
    const one = (cv) => {
      const sh = r.shifts.map((x) => ({ c: x.c, amt: x.d * ((x.c === 'D') === (cv === 0) ? 2.4 : 1.2) }));
      const e = eqBase(d * (cv === 0 ? 2.4 : 1.2), sd * (cv === 0 ? 1.2 : 2.4));
      const word = (v) => (v > 0 ? 'up' : 'down'), dp = Math.sign(e.p - 5), dq = Math.sign(e.q - 5);
      const out = r.answer <= 2 ? `Price ${word(dp)}, quantity <b>${word(dq)}</b>` : `Quantity ${word(dq)}, price <b>${word(dp)}</b>`;
      return `<figure class="case"><figcaption>If ${cv === 0 ? 'demand' : 'supply'} shifts more</figcaption>${sdGraph({ shifts: sh, after: true, numbered: true, label: `Supply and demand graph for ${r.market} if ${cv === 0 ? 'demand' : 'supply'} shifts more` })}<p class="case-out">${out}</p></figure>`;
    };
    return `<p class="cases-lead">The news doesn't say which shift is bigger, so here are both cases:</p><div class="twocases">${one(0)}${one(1)}</div>`;
  }
  function ocValues(set) {
    return set.data.map((row) => [0, 1].map((g) => (set.kind === 'output' ? row[1 - g] / row[g] : row[g] / row[1 - g])));
  }
  function tradeTableHTML(set, after) {

    h += '</tr></thead><tbody>';

      if (after) [0, 1].forEach((g) => {
        const v = oc[i][g], other = set.units[1 - g], isLow = low[g] === i;
        h += `<td class="${g === 0 ? 'oc ' : ''}${isLow ? 'low' : ''}">${isLow ? '✓ ' : ''}${fracFmt(v)} ${esc(v <= 1 + 1e-9 ? other[0] : other[1])}</td>`;

  function scheduleHTML(r, after) {

  function ticketBody(r, seg, revealed) {
    const vw = view();
    pickCtx = { tap: vw.kind !== 'class' && !revealed, pick: vw.kind !== 'class' ? vw.pick : null };
    switch (r.desk) {

        switch (r.visual) {
          case 'ppc-points': return head + fig(ppcPoints(r, revealed));

          case 'ppc-table': return head + `<div class="pair">${tableForPPC(r, revealed)}${fig(ppcFromTable(r, revealed))}</div>`;
          case 'ppc-straight': return head + fig(ppcStraight(revealed));

  }
  function tableForPPC(r, after) {

  function choicesHTML(r, after) {

    return `<div class="choices">${r.choices.map((c, i) => {

  /* Review my misses: the note under the review tag. */

  /* Practice only: points at each control the first time a student meets it. */
  function coachHTML(phase) {

  function roundHTML() {

  /* --- speed round: shift or slide --- */
  function flashMini(item) {
    const W = 170, H = 120, L = 18, Bm = 108, id = uid('f');
    const line = item.curve === 'D' ? [[34, 18], [150, 96]] : [[34, 96], [150, 18]];
    const cls = item.curve === 'D' ? 'g-d' : 'g-s';
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${item.answer === 'SHIFT' ? 'The curve shifts' : 'A move along the curve'}"><defs>${arrowDefs(id)}</defs><path class="g-axis" d="M${L},6 V${Bm} H${W - 4}"/>`;
    if (item.answer === 'SHIFT') {
      const dx = 34 * item.dir;
      s += `<path class="${cls} g-old" d="M${line[0][0]},${line[0][1]} L${line[1][0]},${line[1][1]}"/><path class="${cls}" d="M${line[0][0] + dx},${line[0][1]} L${line[1][0] + dx},${line[1][1]}"/>`;
      const y = 57, x0 = (line[0][0] + line[1][0]) / 2;
      s += `<path class="g-arrow" d="M${x0 + (dx > 0 ? 6 : -6)},${y} H${x0 + dx - (dx > 0 ? 8 : -8)}" marker-end="url(#${id})"/>`;
    } else {
      const at = (t) => [line[0][0] + (line[1][0] - line[0][0]) * t, line[0][1] + (line[1][1] - line[0][1]) * t];
      const priceUp = item.dir > 0;
      const tA = item.curve === 'D' ? (priceUp ? 0.68 : 0.32) : (priceUp ? 0.32 : 0.68);
      const tB = item.curve === 'D' ? (priceUp ? 0.32 : 0.68) : (priceUp ? 0.68 : 0.32);
      const a = at(tA), b = at(tB), dir = [b[0] - a[0], b[1] - a[1]], len = Math.hypot(dir[0], dir[1]);
      const u = [dir[0] / len, dir[1] / len], nrm = [-u[1] * 12, u[0] * 12];
      s += `<path class="${cls}" d="M${line[0][0]},${line[0][1]} L${line[1][0]},${line[1][1]}"/><circle class="g-eq" cx="${a[0]}" cy="${a[1]}" r="6"/><circle class="g-eq2" cx="${b[0]}" cy="${b[1]}" r="7"/>`;
      s += `<path class="g-arrow" d="M${(a[0] + u[0] * 10 + nrm[0]).toFixed(1)},${(a[1] + u[1] * 10 + nrm[1]).toFixed(1)} L${(b[0] - u[0] * 12 + nrm[0]).toFixed(1)},${(b[1] - u[1] * 12 + nrm[1]).toFixed(1)}" marker-end="url(#${id})"/>`;
    }
    return s + '</svg>';
  }
  const speedKeyHTML = (item) => { const g = esc(item.market.toLowerCase()); return `<p class="speed-key"><b>Shift:</b> something other than the price of ${g} changed, so the whole ${g} curve moves. <b>Slide:</b> the price of ${g} itself changed, so you move along the curve.</p>`; };
  const answerWord = (a) => (a === 'SHIFT' ? 'Shift' : 'Slide');
  function speedAnswerHTML(item) { return `<div class="flash-answer"><span class="big"><small>Answer</small>${answerWord(item.answer)}</span>${flashMini(item)}<p>${esc(item.why)}</p></div>`; }
  const marketHTML = (item) => `<p class="flash-count">The market for: <b>${esc(item.market)}</b></p>`;
  function speedIntroHTML() {
    const seg = currentSeg();

      <p class="screen-sub">${seg.items.length} quick sentences, on top of your ${qCount(state.playlist, state.idx).total} questions. Each sentence has its own ${SPEED_SECONDS}-second clock, which starts when the sentence shows. One tap locks in your answer.</p>

        <div class="ss-rule"><b>Slide means</b>${flashMini({ answer: 'SLIDE', curve: 'S', dir: 1 })}<p>The good's own price changed. You move along the curve (demand or supply).</p></div>

  function timerBarHTML() {

  function updateSpeedBar() {

  /* --- Class: halfway check and final standings --- */

  /* --- Solo: name, results card --- */
  function soloStats() {
    const log = state.solo.log, by = {};
    log.forEach((e) => { const b = (by[e.topic] = by[e.topic] || { right: 0, total: 0 }); b.total++; if (e.right) b.right++; });

  /* "2 questions and 2 speed round sentences" */

  const nameGoLabel = (has, st) => (st.misses ? `Next: Review my misses (${st.misses})` : 'Show my results card') + ' ' + icon('arrow');
  function nameHTML() {

    if (state.mode !== 'class' || state.screen !== 'round' || state.phase !== 'revealed') return;
    pushUndo();
    const v = classValue(state.idx), t = state.teams[i], on = !state.marks[i];
    state.marks[i] = on;
    t.cash += on ? v : -v;
    t.history[t.history.length - 1] = t.cash;
    state.deltas = state.deltas || state.teams.map(() => null);
    state.deltas[i] = on ? { delta: v } : null;
    save();
    updateBoard(true);
    if (on) Sound.win();
  }
  function classSpeedShow() { const sp = state.speed; if (sp.phase !== 'ask') return; sp.phase = 'shown'; lock(); Sound.reveal(); save(); renderStage(true); renderBar(); updateBoard(false); }
  function award(i) {
    const sp = state.speed;
    if (state.mode !== 'class' || state.screen !== 'speed' || sp.phase !== 'shown') return;
    pushUndo();
    if (sp.winner != null) { state.teams[sp.winner].cash -= SPEED_PRIZE; sp.won[sp.winner] -= SPEED_PRIZE; }
    if (sp.winner === i) sp.winner = null;
    else { sp.winner = i; state.teams[i].cash += SPEED_PRIZE; sp.won[i] += SPEED_PRIZE; Sound.win(); }
    state.deltas = sp.won.map((w) => (w ? { delta: w } : null));
    save(); updateBoard(true);
  }
  function adjust(i, amt) {
    pushUndo();
    const t = state.teams[i];
    t.cash = Math.max(0, t.cash + amt);
    if (state.done === state.idx && t.history.length) t.history[t.history.length - 1] = t.cash;
    save(); updateBoard(true); renderModal();
  }
  function undo() {
    const snap = undoStack.pop();
    if (!snap) return;
    stopTimer();
    state = JSON.parse(snap);
    if (state.screen === 'round' && state.phase === 'thinking') state.phase = 'hands';
    closeModal(); save(); renderBoard(); renderAll();
  }
  function skipRound() {
    closeModal(); stopTimer();
    if (state.done !== state.idx) { state.teams.forEach((t) => t.history.push(t.cash)); state.done = state.idx; }
    advance();
  }

  /* ================= game flow: Solo ================= */
  function startSolo(length) {
    const settings = state.settings;
    settings.soloLength = length;
    const built = buildPlaylist('solo', length, ALL_TOPICS);
    state = freshState(settings);
    state.mode = 'solo';
    state.playlist = built.segs;
    state.solo = freshSolo(length, !practiced());
    Sound.unlock();
    undoStack.length = 0;
    if (state.solo.practice) { state.screen = 'round'; state.phase = 'answer'; lock(); save(); }
    else enterSegment(0);
    renderBoard(); renderAll();
    requestWake();
  }
  function endPractice() {
    store.set(PRACTICE_KEY, '1');
    state.solo.practice = false;
    enterSegment(0);
    renderBoard(); renderAll();
  }
  function pickAnswer(n) {
    if (state.screen === 'review') { reviewPick(n); return; }
    if (state.mode !== 'solo' || state.screen !== 'round' || (state.phase !== 'answer' && state.phase !== 'bet')) return;
    state.solo.answer = n;
    state.phase = 'bet';
    allArmed = false;
    save(); renderStage(true); renderBar();
  }
  function placeBet(k) {
    if (state.mode !== 'solo' || state.screen !== 'round' || state.phase !== 'bet' || locked()) return;
    const so = state.solo, seg = currentSeg(), r = roundFor(seg), opt = betOptions(seg)[k];
    if (!opt || !so.answer) return;
    if (opt.all && !allArmed) {                                       /* betting it all takes a second tap */
      allArmed = true; lock(); renderStage(true); renderBar();
      setTimeout(() => { if (allArmed) { allArmed = false; if (state.phase === 'bet') { renderStage(true); renderBar(); } } }, 8000);
      return;
    }
    allArmed = false;
    const right = so.answer === r.answer;
    let delta = right ? opt.amount : -Math.min(opt.amount, so.cash), bailout = false;
    if (!so.practice) {
      so.cash += delta;
      if (!seg.final && so.cash <= 0) { so.cash = BAILOUT; bailout = true; }
      so.history.push(so.cash);
      so.log.push({ kind: 'q', segIdx: state.idx, topic: seg.desk, right, bet: opt.amount, delta, answer: so.answer });
      state.done = state.idx;
    } else delta = right ? opt.amount : -opt.amount;
    so.bet = opt.amount;
    so.last = { right, delta, bet: opt.amount, bailout };
    state.phase = 'revealed';
    wantAnim = true;
    lock();
    save(); renderStage(); renderBar(); updateBoard(true);
    Sound.reveal();
    setTimeout(() => { if (right) Sound.win(); else Sound.lose(); }, 700);
  }
  function speedBegin() { const sp = state.speed; if (sp.phase !== 'intro') return; sp.phase = 'ask'; sp.picked = null; startSpeedTimer(); lock(); save(); renderStage(); renderBar(); }
  function speedPick(v) {
    if (state.screen === 'review') { reviewPick(v); return; }
    const sp = state.speed;
    if (state.mode !== 'solo' || state.screen !== 'speed' || !sp || sp.phase !== 'ask') return;
    stopTimer();
    const so = state.solo, item = byId(B.flash, currentSeg().items[sp.i]);
    const right = v === item.answer;
    const delta = right ? SPEED_PRIZE : 0;                    /* speed round: a right answer wins; a wrong one or running out of time costs nothing */
    let bailout = false;
    so.cash += delta;
    if (so.cash <= 0) { so.cash = BAILOUT; bailout = true; }
    so.history.push(so.cash);
    so.log.push({ kind: 'speed', segIdx: state.idx, item: item.id, topic: 'flash', right, picked: v });
    so.last = { right, delta, picked: v, bailout };
    sp.picked = v; sp.phase = 'shown';
    lock();
    save(); renderStage(true); renderBar(); updateBoard(true);
    if (right) Sound.win(); else Sound.lose();
  }
  function speedNext() {
    const sp = state.speed, seg = currentSeg();
    if (sp.i + 1 < seg.items.length) {
      sp.i++; sp.phase = 'ask'; sp.picked = null; sp.winner = null;
      if (state.mode === 'solo') { state.solo.last = null; startSpeedTimer(); }
      lock(); save(); renderStage(); renderBar(); updateBoard(false);
    } else {
      if (state.mode === 'class') state.teams.forEach((t) => t.history.push(t.cash));
      state.done = state.idx;
      advance();
    }
  }
  function submitName(raw) {
    const name = String(raw || '').replace(/\s+/g, ' ').trim().slice(0, 40);
    if (!name) {
      nameError = 'Type your name first.';
      const m = $('#nameMsg'); if (m) { m.textContent = nameError; m.hidden = false; }
      const inp = $('#studentName'); if (inp) inp.focus();
      return;
    }
    state.solo.name = name; nameError = '';
    store.set(NAME_KEY, name);
    if (soloStats().misses) { startReview(); return; }
    state.screen = 'card';
    save(); renderAll();
    keepCard();
    Sound.fanfare();
  }
  function startReview() {
    const so = state.solo, items = [];
    so.log.forEach((e, k) => { if (!e.right) items.push(k); });
    if (!items.length) return;
    so.review = { items, i: 0, answer: null, right: 0, lastRight: false };
    state.screen = 'review'; state.phase = 'answer'; state.hintShown = false; state.caseView = 0;
    lock(); save(); renderAll();
  }
  function reviewPick(v) {
    const so = state.solo, rv = so.review;
    if (!rv || (state.phase !== 'answer' && state.phase !== 'chosen')) return;
    skipArmed = false;
    const e = so.log[rv.items[rv.i]];
    rv.answer = v; state.phase = 'chosen'; save(); renderStage(true); renderBar();
  }
  /* Check a review answer (after the student picks one, then taps Check my answer). */
  function reviewCheck(v) {
    const so = state.solo, rv = so.review;
    if (!rv) return;
    const e = so.log[rv.items[rv.i]];
    if (v == null) v = rv.answer;
    if (v == null) return;
    const right = e.kind === 'speed' ? v === byId(B.flash, e.item).answer : v === roundFor(state.playlist[e.segIdx]).answer;
    rv.answer = v; rv.lastRight = right;
    if (right) rv.right++;
    state.phase = 'revealed';
    wantAnim = true;
    lock(); save(); renderStage(); renderBar();
    if (right) Sound.win(); else Sound.lose();
  }
  function reviewNext() {
    const so = state.solo, rv = so.review;
    if (rv.i + 1 < rv.items.length) { rv.i++; rv.answer = null; state.phase = 'answer'; state.hintShown = false; state.caseView = 0; lock(); save(); renderStage(); renderBar(); return; }
    so.reviewDone = { right: rv.right, total: rv.items.length, skipped: 0 };
    so.review = null;
    state.screen = 'card';
    lock(); save(); renderAll();
    keepCard();
    Sound.fanfare();
  }

  function skipReview() {
    const so = state.solo, rv = so.review;
    if (!rv) return;
    const tried = rv.i + (state.phase === 'revealed' ? 1 : 0);
    so.reviewDone = { right: rv.right, total: rv.items.length, skipped: rv.items.length - tried };
    so.review = null;
    state.screen = 'card';
    lock(); save(); renderAll();
    keepCard();
    Sound.fanfare();
  }

  /* The one main action on each screen: the → key, Space, Enter, or the main button. */
  function primaryAction() {
    if (modalKind || locked()) return;
    const scr = state.screen, ph = state.phase;
    if (scr === 'classSetup') startFromSetup();
    else if (scr === 'round') {
      if (state.mode === 'class') { if (ph === 'thinking') handsUp(); else if (ph === 'hands') classReveal(); else if (ph === 'revealed') advance(); }
      else if (ph === 'revealed') { if (state.solo.practice) endPractice(); else advance(); }
    } else if (scr === 'speed') {
      const sp = state.speed;
      if (state.mode === 'class') { if (sp.phase === 'ask') classSpeedShow(); else speedNext(); }
      else if (sp.phase === 'intro') speedBegin();
      else if (sp.phase === 'shown') speedNext();
    } else if (scr === 'half') { enterSegment(state.idx + 1); renderAll(); if (currentSeg().final) Sound.bell(2); }
    else if (scr === 'review' && ph === 'revealed') reviewNext();
    else if (scr === 'review' && ph === 'chosen') reviewCheck();
  }
  function confetti() {
    if (reduceMotion()) return;
    const cv = document.createElement('canvas');
    cv.id = 'fx';
    document.body.appendChild(cv);
    const ctx = cv.getContext('2d');
    if (!ctx) { cv.remove(); return; }
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = window.innerWidth * dpr; cv.height = window.innerHeight * dpr;
    const css = getComputedStyle(document.documentElement);
    const colors = [1, 2, 3, 4, 5, 6].map((k) => css.getPropertyValue('--t' + k).trim()).concat([css.getPropertyValue('--board-amber').trim()]);
    const parts = Array.from({ length: 170 }, () => ({ x: Math.random() * cv.width, y: -Math.random() * cv.height * 0.6, vx: (Math.random() - 0.5) * 3 * dpr, vy: (2 + Math.random() * 4) * dpr, r: (5 + Math.random() * 7) * dpr, a: Math.random() * 6.3, va: (Math.random() - 0.5) * 0.3, c: rand(colors) }));
    const t0 = performance.now();
    (function frame(now) {
      const el = now - t0;
      ctx.clearRect(0, 0, cv.width, cv.height);
      parts.forEach((p) => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.05 * dpr; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.globalAlpha = Math.max(0, 1 - el / 4200); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
      });
      if (el < 4300) requestAnimationFrame(frame); else cv.remove();
    })(t0);
  }

  /* ================= events ================= */
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act, i = +b.dataset.i, n = +b.dataset.n;
    switch (act) {
      case 'go': primaryAction(); break;
      case 'solo': openSetup('solo'); break;
      case 'class': openSetup('class'); break;
      case 'home': goHome(); break;
      case 'len': startSolo(b.dataset.len); break;
      case 'start': if (!locked()) startFromSetup(); break;
      case 'answer': pickAnswer(n); break;
      case 'bet': placeBet(+b.dataset.k); break;
      case 'pick': speedPick(b.dataset.v); break;
      case 'tile': if (canMark() === 'round') toggleMark(i); else if (canMark() === 'speed') award(i); break;
      case 'skipPractice': endPractice(); break;
      case 'check': if (!locked()) reviewCheck(); break;
      case 'skipReview':
        if (locked()) break;
        if (!skipArmed) { skipArmed = true; lock(); renderBar(); setTimeout(() => { if (skipArmed) { skipArmed = false; if (state.screen === 'review') renderBar(); } }, 5000); break; }
        skipArmed = false; skipReview();
        break;
      case 'cancelAll': allArmed = false; renderStage(true); renderBar(); break;
      case 'lastCard': state.screen = 'lastCard'; renderAll(); break;
      case 'review': if (!locked()) startReview(); break;
      case 'again':
        if (state.screen === 'card' && !againArmed) { againArmed = true; renderBar(); setTimeout(() => { if (againArmed) { againArmed = false; if (state.screen === 'card') renderBar(); } }, 4000); break; }
        againArmed = false;
        if (state.screen === 'card') goHome();
        else if (state.mode === 'solo') startSolo(state.solo ? state.solo.length : state.settings.soloLength); else startClass(true);
        break;
      case 'setup': openSetup('class'); break;
      case 'hint': state.hintShown = true; save(); renderStage(true); renderBar(); break;
      case 'pause': togglePause(); break;
      case 'plus': addTime(); break;
      case 'teams-': case 'teams+': {
        const s = state.settings;
        s.teamCount = Math.max(2, Math.min(6, s.teamCount + (act === 'teams+' ? 1 : -1)));
        $('#teamRows').innerHTML = teamRowsHTML();
        updateSetupMeta(); renderBoard(); save();
        break;
      }
      case 'resume': {
        const p = state.pending;
        if (!p) break;
        state = p; state.pending = null;
        resumeTimers();
        save(); renderBoard(); renderAll();
        break;
      }
      case 'discard': state.pending = null; save(); renderStage(); renderBar(); break;
      case 'rules': openModal('rules'); break;
      case 'tools': openModal('tools'); break;
      case 'close': closeModal(); break;
      case 'sound': toggleSound(); break;
      case 'theme': cycleTheme(); break;
      case 'full': toggleFullscreen(); break;
      case 'adj': adjust(i, n); break;
      case 'undo': undo(); break;
      case 'skip': skipRound(); break;
      case 'end': closeModal(); finish(); break;
      case 'quit':
        if (!quitArmed) { quitArmed = true; renderModal(); setTimeout(() => { if (quitArmed) { quitArmed = false; renderModal(); } }, 4000); break; }
        closeModal();
        if (state.mode === 'class') openSetup('class'); else goHome();
        break;
    }
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.teamInput != null) {
      state.settings.names[+t.dataset.teamInput] = t.value;
      buildTeams(state.settings).forEach((tm, k) => { const b = $('#badge-' + k); if (b) b.textContent = tm.badge; });
      renderBoard(); save();
    } else if (t.id === 'studentName') {
      const go = $('#nameGo'), has = !!t.value.trim();
      if (go) go.disabled = !has;
      if (nameError) { nameError = ''; const m = $('#nameMsg'); if (m) m.hidden = true; }
    }
  });
  document.addEventListener('toggle', (e) => { if (e.target && e.target.id === 'moreOptions') moreOpen = e.target.open; }, true);
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.name === 'len') { state.settings.length = t.value; save(); }
    else if (t.name === 'pace') { state.settings.pace = t.value; save(); }
    else if (t.dataset && t.dataset.topic) { state.settings.topics[t.dataset.topic] = t.checked; updateSetupMeta(); save(); }
  });
  document.addEventListener('submit', (e) => {
    if (!e.target) return;
    if (e.target.id === 'setup') { e.preventDefault(); startFromSetup(); }
    else if (e.target.id === 'nameForm') { e.preventDefault(); submitName(($('#studentName') || {}).value); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (e.key === 'Escape') { if (modalKind) { e.preventDefault(); closeModal(); } return; }
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable || modalKind) return;
    const onControl = tag === 'button' || tag === 'a' || tag === 'summary';
    const answering = (state.screen === 'round' || (state.screen === 'review' && view().entry.kind !== 'speed')) && (state.phase === 'answer' || state.phase === 'bet' || state.phase === 'chosen');
    if (state.mode === 'solo' && answering && /^[1-4]$/.test(e.key)) { e.preventDefault(); pickAnswer(+e.key); return; }
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || ((e.key === ' ' || e.key === 'Enter') && !onControl)) {
      if (['round', 'speed', 'half', 'review'].indexOf(state.screen) !== -1) { e.preventDefault(); primaryAction(); }
    } else if (e.key === 'm' || e.key === 'M') { if (state.mode) toggleSound(); }
    else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  });

  /* ================= boot ================= */
  function selfCheck() {
    const bad = [];
    B.economy.concat(B.inventory, B.tradeInput).forEach((x) => { if (!(x.answer >= 1 && x.answer <= 4) || x.options.length !== 4) bad.push(x.id); });
    B.tradeSets.forEach((s) => ['specialize', 'terms'].forEach((p) => { const q = s[p]; if (!(q.answer >= 1 && q.answer <= 4) || q.options.length !== 4) bad.push(q.id); }));
    if (!B.practice || !B.practice.shift) bad.push('practice');
    if (bad.length) console.warn('Open Outcry: check these rounds', bad);
  }
  function start(data) {
    hostTheme = document.documentElement.getAttribute('data-theme');
    try { const hot = window.claude && window.claude.hot; if (hot && hot.snapshot) hot.snapshot(() => ({ state: JSON.parse(JSON.stringify(state)) })); } catch (e) { /* ignore */ }
    selfCheck();
    const restored = data && data.state && data.state.v === 2 ? data.state : null;
    if (restored) { state = restored; resumeTimers(); }
    else {
      const saved = loadSaved();
      const base = (saved && saved.settings) || loadOldSettings() || {};
      state.settings = Object.assign(defaultSettings(), base);
      state.settings.topics = Object.assign({}, ALL_TOPICS, base.topics || {});
      if (saved && inGame(saved)) state.pending = Object.assign({}, saved, { pending: null });
      else if (saved && saved.pending && inGame(saved.pending)) state.pending = saved.pending;
    }
    applyTheme(store.get(THEME_KEY) || 'auto');
    renderBoard();
    renderAll();
  }
  /* Test hook for tools/playtest.py. Keep it working. */
  window.__oo = {
    get state() { return state; }, roundFor, buildPlaylist, B, view, betOptions: () => betOptions(currentSeg()), classValue: (i) => classValue(i == null ? state.idx : i),
    enter: (i) => { enterSegment(i); renderBoard(); renderAll(); },
    timeout: () => { if (timer.running) { timer.left = 0; timer.last = performance.now(); tick(); } },
    unlock: () => { lockUntil = 0; }
  };
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
